<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>清明放假通知</title>
<style>
  body {
    margin: 0;
    width: 1080px;
    height: 1440px;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #0f2747 0%, #1d4b7a 55%, #103253 100%);
    color: #fff;
  }
  .wrap {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 80px 80px 60px;
    position: relative;
  }
  .line {
    height: 4px;
    background: linear-gradient(90deg, transparent, #e7c46a, transparent);
    margin: 10px 0 35px;
  }
  .title {
    text-align: center;
    color: #f6d36b;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-top: 20px;
  }
  .subtitle {
    text-align: center;
    font-size: 34px;
    margin: 20px 0 30px;
    color: #eef6ff;
    font-weight: 600;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 28px;
    padding: 34px 38px;
    margin-top: 26px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.18);
    backdrop-filter: blur(4px);
  }
  .section-title {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 18px;
  }
  .gold { color: #ffd56f; }
  .blue { color: #8ed0ff; }
  .green { color: #7ee0a3; }
  .red { color: #ff9a9a; }
  .text {
    font-size: 30px;
    line-height: 1.8;
    color: #f8fbff;
  }
  ul {
    margin: 10px 0 0 0;
    padding-left: 1.2em;
  }
  li {
    margin: 12px 0;
    font-size: 30px;
    line-height: 1.7;
  }
  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 56px;
    text-align: center;
  }
  .phone {
    font-size: 38px;
    font-weight: 800;
    color: #ffd56f;
    margin-top: 10px;
  }
  .company {
    margin-top: 20px;
    font-size: 26px;
    color: rgba(255,255,255,0.75);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">清明放假通知</div>
    <div class="line"></div>
    <div class="subtitle">放假时间：周六、周日（两天）</div>

    <div class="card">
      <div class="section-title blue">【生产车间安排】</div>
      <div class="text">放假期间停止生产。</div>
    </div>

    <div class="card">
      <div class="section-title gold">【个别加班人员】</div>
      <ul>
        <li>钳工：耿迎强（激光机 4255）</li>
        <li>秦新朝（6代 1630 双龙门）</li>
        <li>打包：马杰（展会机器及出口机 2650）</li>
      </ul>
    </div>

    <div class="card">
      <div class="section-title green">【值班人员】</div>
      <div class="text">步国军</div>
    </div>

    <div class="card">
      <div class="section-title red">【温馨提示】</div>
      <div class="text">清明出行，请大家注意交通安全。</div>
    </div>

    <div class="footer">
      <div class="phone">联系电话：18678398139</div>
      <div class="company">济南红太阳数控设备有限公司</div>
    </div>
  </div>
</body>
</html>
