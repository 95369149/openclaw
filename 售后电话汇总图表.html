<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fb;margin:0;padding:24px;color:#111} .wrap{max-width:1400px;margin:0 auto} .title{font-size:34px;font-weight:800;margin-bottom:8px} .sub{font-size:18px;color:#444;margin-bottom:20px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px} .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.06)} .chart{height:360px} .conclusion{font-size:22px;font-weight:700;margin-bottom:12px} ul{padding-left:24px;line-height:1.9;font-size:18px}</style></head><body><div class="wrap"><div class="title">3.14-3.20 售后电话汇总图表</div><div class="sub">总电话量：70　已解决：70　未标注/其他：0</div><div class="grid"><div class="card"><div id="c1" class="chart"></div></div><div class="card"><div id="c2" class="chart"></div></div><div class="card"><div id="c3" class="chart"></div></div><div class="card"><div class="conclusion">老板版结论</div><ul><li>本周售后电话共 70 个，工作量主要集中在少数技术人员。</li><li>电话量最高：贾泽琪（21个）。</li><li>高频问题主要为：驱动器报警、不吸风、定位不准。</li><li>建议下周围绕高频故障做专项培训和复盘。</li></ul></div></div></div><script>const tech=[["贾泽琪", 21], ["何强聪", 18], ["许德金", 11], ["耿浩飞", 8], ["秦振洋", 7]];const issue=[["驱动器报警", 4], ["不吸风", 2], ["定位不准", 2], ["皮带有点老化", 1], ["对射保护", 1], ["接口对不上", 1]];const region=[["未标注", 46], ["河北", 6], ["浙江", 4], ["江苏", 4], ["山东", 3], ["福建", 2]];echarts.init(document.getElementById('c1')).setOption({title:{text:'技术人员电话量 TOP5'},tooltip:{},xAxis:{type:'value'},yAxis:{type:'category',data:tech.map(x=>x[0]).reverse()},series:[{type:'bar',data:tech.map(x=>x[1]).reverse(),itemStyle:{color:'#2E86DE'}}]});echarts.init(document.getElementById('c2')).setOption({title:{text:'高频问题分布'},tooltip:{trigger:'item'},series:[{type:'pie',radius:['35%','68%'],data:issue.map(x=>({name:x[0],value:x[1]}))}]});echarts.init(document.getElementById('c3')).setOption({title:{text:'地区分布 TOP6'},tooltip:{},xAxis:{type:'category',data:region.map(x=>x[0])},yAxis:{type:'value'},series:[{type:'bar',data:region.map(x=>x[1]),itemStyle:{color:'#27AE60'}}]});</script></body></html>
